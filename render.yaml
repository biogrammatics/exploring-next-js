databases:
  - name: biogrammatics-nextjs-db
    # Basic-256mb (0.1 CPU, 256 MB). The database was upgraded from free in the
    # dashboard; a Blueprint declaring a lower plan fails sync ("cannot downgrade").
    plan: 0.1c-256mb
    databaseName: biogrammatics
    user: biogrammatics

services:
  - type: web
    name: biogrammatics-nextjs
    runtime: node
    # 0.5 CPU / 512 MB, $7/month (formerly "starter"). Must match the dashboard:
    # a Blueprint sync applies this value, and "free" here downgraded the service
    # once already. Paid plan also enables preDeployCommand.
    plan: 0.5c-512mb
    rootDir: company-site
    buildCommand: npm install && npm run build
    # Schema sync runs as a pre-deploy step: after build, before the new instance
    # starts, inside Render's private network (the build container cannot reach the
    # database's internal hostname). Without --accept-data-loss, a change that would
    # drop data fails the deploy and the previous release keeps serving.
    # Long-term fix is `prisma migrate deploy` after baselining migrations.
    preDeployCommand: npx prisma db push
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: biogrammatics-nextjs-db
          property: connectionString
      - key: NEXTAUTH_URL
        value: https://beta.biogrammatics.com
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_EMAIL
        value: tom.chappell@biogrammatics.com
      - key: EMAIL_FROM
        value: BioGrammatics <noreply@links.biogrammatics.com>

  # Background worker for codon optimization jobs
  - type: worker
    name: biogrammatics-codon-worker
    runtime: node
    # Render renamed instance plans to cpu/memory names; "starter" (0.5 CPU, 512 MB,
    # $7/month) is now 0.5c-512mb. Legacy names fail Blueprint sync validation.
    plan: 0.5c-512mb
    rootDir: company-site
    buildCommand: npm install && npx prisma generate
    startCommand: npx tsx worker/codon-worker.ts
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: biogrammatics-nextjs-db
          property: connectionString
      - key: NEXTAUTH_URL
        value: https://beta.biogrammatics.com
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: BioGrammatics <noreply@links.biogrammatics.com>
